title: "mint suit, global report + sublime"
paragraphs:
  - text: >-
      hey. this is where i put the stuff i make as MINT SUIT. theres two albums
      right now and yeah they dont really sound alike, i know
  - lead: Global Report.
    text: >-
      2017. its all old weather reports, japanese and american TV from the 80's
      and 90s. i slowed everything way down and at some point the guy doing the
      forecast stops sounding like the forecast?? he sounds like hes talking to
      you. hard to explain. two long tracks, no names on them. it gets fuzzy and
      jumps channels sometimes, thats intended lol. i also played some parts
      on top with my casio keyboard going into VSTs, synths mostly
  - lead: Sublime.
    text: >-
      2019. same trick but with perfume and makeup commercials this time, those
      whisper voices selling you eternal youth. less slowed, so its warmer and
      it actually moves. 8 tracks on this one. and again the casio + VST
      synths all over it
  - text: >-
      btw this is a hobby, im not a pro or anything. i just like music a lot and
      waste way to many hours editing and mixing. everything here was cut,
      arranged and mixed by me but its built on samples from other artists
      original songs, so credit to them

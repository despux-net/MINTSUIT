title: "MINT SUIT: two albums, Global Report and Sublime"
paragraphs:
  - text: Hi, I make music as MINT SUIT. There are two albums so far, and
      honestly they dont sound much alike. Thats on purpose.
  - lead: Global Report.
    text: (2017) This one is built entirely out of old weather reports from
      Japanese and North American TV, stuff from the 80's and 90s. I slowed it
      all the way down, and something weird happens when you do that. The
      forecaster stops sounding like hes telling you the weather and starts
      sounding like he's talking just to you. It's only two long tracks, no
      titles. It fades out, gets fuzzy, drifts to another channel and comes
      back. Its not really an album you skip around in. You put it on and let
      it run. On top of the samples I added my own arrangements, played on a
      CASIO keyboard through VST plugins, with synths in alot of spots.
  - lead: Sublime.
    text: (2019) Same idea, different source. This time it's old beauty and
      perfume commercials, those soft whispery voices that have been promising
      eternal youth since forever. I slowed them down just enough that they
      feel close and personal. It's warmer and a bit faster than Global Report,
      and this time there are eight actual tracks, so you can pick a favorite
      and go back to it. Same setup as before, too, with arrangements played on my
      CASIO keyboard through VSTs, and synths all over the place.
  - text: >-
      Quick disclaimer: this is just a hobby. Im not a pro, I just really love
      music and spend way to much time listening, editing and mixing.


      Everything here was edited, arranged and mixed by me with audio software
      and a keyboard, using samples from other artists' original work.

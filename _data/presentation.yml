title: "MINT SUIT presents: two frequencies, one signal — Global Report and Sublime"
paragraphs:
  - text: I make music as MINT SUIT. Two collections exist under that name. They
      were never meant to match.
  - lead: Global Report.
    text: "2017. A forecast that never resolves. Sourced entirely from Japanese and
      North American weather broadcasts, 80s and 90s, pulled down into a slower
      register until the voice on the other end stops informing you and starts
      seducing you instead — the way certainty always did, back when a reporter
      could promise you tomorrow’s sky and you believed him. No tracks. No
      titles. Two transmissions only: Side A, 21:34. Side B, 22:22. Forty-four
      minutes, uninterrupted, because a signal doesn’t pause to be liked. It
      fades, it distorts, it finds itself again on another frequency. You don’t
      select a favorite moment. You are placed inside the broadcast and left
      there."
  - lead: Sublime.
    text: "2019. The same instinct, dressed for the counter display. Beauty
      commercials. Perfume campaigns. The whispering voice that has sold eternal
      youth since before either of us were born, now slowed just enough to sound
      like it’s confiding in you personally. Warmer. Faster. Built to move
      product, and bodies. Eight discrete transmissions this time, because
      desire needs a runtime it can return to: Sex & Velvet, 3:15. Hungry Lips,
      3:27. Vanilla, 2:48. Y2Ks Eyes, 3:20. Redamancy, 3:40. Pick You Up At 8,
      4:07. DEMO #01 indulges itself to 6:00, a campaign that forgot to end.
      Divine closes the display at 1:18 —"
  - text: >-
      This musical project is purely a personal hobby and strictly non-profit. I
      am not a professional musician; everything shared here comes from a
      passion for music, editing, and mixing.


      All tracks featured here were edited, arranged, and mixed by me using
      audio production software and keyboard setups, built upon samples from
      other artists' original works. Full credit and copyright for all original
      samples belong entirely to the respective artists and creators.

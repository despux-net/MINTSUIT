title: mint suit, global report + sublime
paragraphs:
  - text: hey. this is where i put the stuff i make as MINT SUIT. theres two albums
      right now and yeah they dont really sound alike, i know
  - lead: Global Report.
    text: 2017. its all old weather reports, japanese and american TV from the 80's
      and 90s. i slowed everything way down, he sounds like hes talking to you.
      hard to explain. two long tracks, no names on them
  - lead: Sublime.
    text: 2019. same trick but  less slowed, so its warmer and it actually moves. 8
      tracks on this one. and again the casio + VST synths all over it
  - text: this is a hobby, im not a pro musician or anything. i just like music a
      lot and waste way to many hours editing and mixing. everything here was
      cut, arranged and mixed by me but its built on samples from other artists
      original songs, so credit to them

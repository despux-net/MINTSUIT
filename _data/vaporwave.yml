tab: About
title: Vaporwave & Future Funk, a (kinda) short history
image: /assets/digital-audio-revolution.jpg
image_alt: 'A hand balancing a compact disc on its fingertips: "The Digital Audio Revolution."'
intro: >-
  ok so these are two genres that were basically born on the internet, out of
  the same old tapes, but they went in totally opposite directions. One slows
  the past down until it hurts, the other speeds it up until you cant help
  dancing. Heres where they came from and where MINT SUIT kind of sits in
  between.
sections:
  - heading: Where vaporwave came from
    text: >-
      Vaporwave showed up around 2010-2011, and not in some city or club
      scene, it was all Bandcamp pages, Tumblr blogs and music forums. It came
      out of hypnagogic pop, chillwave and the older plunderphonics thing
      where you make new music entirely out of existing recordings.

      The big ones for me. Daniel Lopatin's Chuck Person's Eccojams Vol. 1
      (2010) looped and slowed bits of 80s pop until they sounded like a
      memory on a tape thats about to die. James Ferraro's Far Side Virtual
      (2011) made ringtones and stock computer sounds into this weird portrait
      of consumer life. And then later that year Vektroid put out Floral
      Shoppe as Macintosh Plus, and honestly thats the record that defined the
      genre for everyone who came after. If you only listen to one, its that
      one.
  - heading: The sound
    text: >-
      The raw material is all the music nobody was ever supposed to actually
      listen to. Muzak, smooth jazz, elevator and mall music, corporate
      training videos, late night TV ads, the soft jazz that played under the
      weather forecast.

      You slow it down, pitch it, chop it, loop it and drown it in reverb.
      What comes out is warm and kinda creepy at the same time, like
      nostalgia for this shiny future they promised us in the 80s and 90s that
      never really showed up, heard through fog. A couple of smaller scenes
      grew around that too, like mallsoft (all reverb and distant muzak) and
      signalwave (made from broken TV and radio transmissions).
  - heading: Future funk
    text: >-
      Around 2012-2013 an offshoot turned the dial the other way. Instead of
      slowing samples down, future funk speeds them up. It grabs Japanese
      city pop, 80s boogie, disco and anime themes and throws French house
      filters on them, that pumping sidechain, and a steady four on the floor
      kick.

      None of that was new tbh, Daft Punk already wrote the blueprint.
      Homework (1997) and Discovery (2001) took old disco and soul records,
      looped a couple bars, swept a filter over them and just let it breathe.
      Da Funk, Around the World, One More Time. French house, and Daft Punk
      more than anyone, is pretty much the direct ancestor of future funk.

      Then producers like Saint Pepsi, Macross 82-99, Yung Bae and Night
      Tempo picked it up and made it bright, danceable and way easier to get
      into than vaporwave, while still keeping that same love for the glossy
      sound of the past.
  - heading: Where MINT SUIT fits
    text: >-
      Global Report (2017), the first MINT SUIT album, is old school
      vaporwave, no compromises. Weather broadcasts from Japan and North
      America slowed into one long drifting transmission, no hooks, nothing to
      hold on to. You either vibe with it or you dont.

      Sublime (2019) still has the vaporwave soul but the heart is more future
      funk. Its made from beauty commercials and perfume ads, and its warmer,
      faster, more catchy and made to move. Basically vaporwave you can
      dance to.

      On both of them I layered my own arrangements on top of the samples,
      played on a CASIO keyboard through VST plugins, with synths in alot of
      places.

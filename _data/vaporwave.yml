tab: About
title: vaporwave and future funk (my take)
image: /assets/digital-audio-revolution.jpg
image_alt: 'A hand balancing a compact disc on its fingertips: "The Digital
  Audio Revolution."'
intro: people ask me what genre this is so heres my short version. not a history
  lesson, just how i see it
sections:
  - heading: vaporwave
    text: elevator music, mall music, smooth jazz, old ads, the stuff under the
      weather channel. slow it, add a ton of reverb and it gets nostalgic and a
      little creepy at the same time. like remembering a future that never
      happened
  - heading: future funk
    text: >2-
       honestly thats just Daft Punk. go listen to Da Funk or One More Time,
      same idea, old records looped with a filter on them Saint Pepsi, Macross
      82-99, Night Tempo, Yung Bae. start with any of those, its way more fun
      and easy to get into than vaporwave.
  - heading: and me
    text: >-
      Global Report (2017) is the old school slow kind. weather reports, no
      hooks, you either get it or you dont

      Sublime (2019) is somewhere in the middle. still vaporwave but it wants
      you to move, i guess thats the future funk side of me

      in both i played extra stuff on a casio keyboard through VSTs, synths
      mainly, over the samples

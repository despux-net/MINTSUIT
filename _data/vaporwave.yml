tab: Vaporwave
title: Vaporwave & Future Funk — a short history
intro: >-
  Two genres born on the internet, out of the same old tapes, heading in
  opposite directions: one slows the past down until it aches, the other
  speeds it up until it dances. This is where they came from, and where
  MINT SUIT sits between them.
sections:
  - heading: Where vaporwave came from
    text: >-
      Vaporwave appeared around 2010 and 2011, not in a city or a club but on
      Bandcamp pages, Tumblr blogs and music forums. It grew out of
      hypnagogic pop, chillwave and the older plunderphonics tradition of
      building new music entirely from existing recordings.

      Daniel Lopatin's Chuck Person's Eccojams Vol. 1 (2010) looped and slowed
      fragments of 80s pop until they sounded like memories played back on a
      failing tape. James Ferraro's Far Side Virtual (2011) turned ringtones
      and stock software sounds into a portrait of consumer life. Later that
      year, Vektroid's Floral Shoppe, released as Macintosh Plus, became the
      record that defined the genre for everyone who came after.
  - heading: The sound
    text: >-
      The raw material is the music nobody was supposed to listen to closely:
      muzak, smooth jazz, elevator and shopping-mall music, corporate
      training videos, late-night TV commercials and the soft jazz that ran
      under weather forecasts.

      Those sources are slowed down, pitched, chopped, looped and drowned in
      reverb. The result is warm and unsettling at once: nostalgia for a
      shiny future that was promised in the 80s and 90s and never quite
      arrived, heard through fog.
  - heading: The look
    text: >-
      Vaporwave has always been as visual as it is sonic: Windows 95 windows,
      marble busts, palm trees, pastel grids, Japanese katakana, early 3D
      renders and VHS noise. Around it grew smaller scenes such as mallsoft,
      which recreates empty shopping centres, and signalwave, built from
      broken television and radio transmissions.
  - heading: Future funk
    text: >-
      Around 2012 and 2013 an offshoot turned the dial the other way. Instead
      of slowing its samples down, future funk speeds them up. It takes
      Japanese city pop, 80s boogie, disco and anime themes and dresses them
      in French-house filters, pumping sidechain compression and a steady
      four-on-the-floor kick.

      Producers such as Saint Pepsi, Macross 82-99, Yung Bae and Night Tempo
      made it bright, danceable and far more approachable than its parent,
      while keeping the same love for the glossy sound of the past.
  - heading: Where MINT SUIT fits
    text: >-
      Global Report (2017), the first MINT SUIT album, is old-school
      vaporwave, pure and uncompromising: weather broadcasts from Japan and
      North America slowed into a long, drifting transmission with no hooks
      and no concessions.

      Sublime (2019) keeps the vaporwave soul but carries the heart of future
      funk. Built from beauty commercials and perfume campaigns, it is
      warmer, faster, more commercial and made to move — vaporwave you can
      dance to.

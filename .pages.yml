# Pages CMS (https://app.pagescms.org) — everything the site shows is edited
# here. Each entry is one file in _data/; saving commits it, and GitHub Pages
# rebuilds mintsuit.com in a minute or two.

media:
  input: assets
  output: /assets

content:

  - name: top
    label: Top of the page
    path: _data/top.yml
    type: file
    fields:
      - name: wordmark
        label: Name at the top
        type: string
        required: true
        description: >-
          The site's name. With the title as text, it is the big title in
          Roman capitals; with a title image, it is what screen readers and
          search engines read in its place.
      - name: title_style
        label: Title at the top
        type: select
        options:
          values:
            - value: image
              label: Title image
            - value: text
              label: Text (the original, in Roman capitals)
        description: >-
          Pick "Text" to go back to the original title in letters. Pick
          "Title image" to show the picture below instead.
      - name: title_image
        label: Title image
        type: image
        description: >-
          Shown when "Title at the top" is "Title image". A PNG with a
          transparent background, cropped close to the letters, works best.
          Delete the image here to go back to the MINT SUIT PORTAL logo.
      - name: notice
        label: Line under the name
        type: text
        description: >-
          One short line shows in spaced small caps. Several lines, or one long
          line, show as ordinary paragraphs. Leave it empty to hide it.
      - name: construction
        label: Ribbon
        type: string
        description: >-
          A yellow and black strip under the tabs, for news such as a
          release. Leave it empty to hide it.

  - name: background
    label: Background
    path: _data/background.yml
    type: file
    fields:
      - name: image
        label: Background image
        type: image
        description: >-
          The photo behind the whole page; the file can have any name. It is
          shown blurred and darkened, so a JPG under 1 MB is plenty. Leave it
          empty and the New York skyline comes back.

  - name: records
    label: Records
    path: _data/records.yml
    type: file
    fields:
      - name: records
        label: Records
        type: object
        list: true
        description: Shown side by side, in this order. Drag to reorder.
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: kind
            label: Type
            type: string
            description: For example Album or EP.
          - name: year
            label: Year
            type: string
          - name: url
            label: Link
            type: string
            description: Where the cover and the title go, usually Bandcamp.
          - name: bandcamp_id
            label: Bandcamp album ID
            type: string
            description: >-
              Shows Bandcamp's own player for this album in place of the cover.
              It is the number after "album=" in the album's Share / Embed code
              on Bandcamp. Leave it empty to show the cover instead.
          - name: cover
            label: Cover
            type: image
            description: A square image works best.
          - name: blurb
            label: Short description
            type: text

  - name: presentation
    label: Presentation
    path: _data/presentation.yml
    type: file
    fields:
      - name: title
        label: Title
        type: string
      - name: paragraphs
        label: Paragraphs
        type: object
        list: true
        fields:
          - name: lead
            label: Opening words (optional)
            type: string
            description: >-
              Set in small caps at the start of the paragraph, like
              "Global Report." Leave empty for a plain paragraph.
          - name: text
            label: Text
            type: text
            required: true

  - name: vaporwave
    label: About tab (vaporwave history)
    path: _data/vaporwave.yml
    type: file
    fields:
      - name: tab
        label: Tab name
        type: string
        description: The label of the tab next to Records.
      - name: title
        label: Title
        type: string
      - name: image
        label: Picture
        type: image
        description: >-
          Shown in a frame at the top right of the text. Leave it empty to
          hide it.
      - name: image_alt
        label: Picture description
        type: string
        description: Read aloud by screen readers, and read by Google.
      - name: intro
        label: Introduction
        type: text
        description: Set in italics under the title.
      - name: sections
        label: Sections
        type: object
        list: true
        description: >-
          The article, one block per heading. Delete every section to hide the
          tab altogether.
        fields:
          - name: heading
            label: Heading
            type: string
          - name: text
            label: Text
            type: text
            required: true
            description: Each line is its own paragraph.
      - name: listen
        label: Listen everywhere (under the text)
        type: object
        fields:
          - name: title
            label: Name read by screen readers
            type: string
          - name: note
            label: Line under the logo
            type: text
          - name: singles
            label: Singles
            type: object
            list: true
            description: One button each, usually the DistroKid HyperFollow link.
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: url
                label: Link
                type: string
                required: true
          - name: profiles
            label: Artist profiles
            type: object
            list: true
            description: >-
              Spotify, Apple Music and the rest. Shown as buttons, and told to
              Google as the same artist as this site.
            fields:
              - name: label
                label: Platform
                type: string
                required: true
              - name: url
                label: Artist page address
                type: string
                required: true

  - name: merch
    label: Merch tab
    path: _data/merch.yml
    type: file
    fields:
      - name: tab
        label: Tab name
        type: string
        description: The label of the tab, and of the button in the left column.
      - name: title
        label: Title
        type: string
      - name: intro
        label: Introduction
        type: text
      - name: items
        label: Items
        type: object
        list: true
        description: >-
          Shown side by side in the Merch tab, and their pictures are the ones
          that fade into each other in the left column. Delete every item to
          hide the tab and the panel altogether.
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: format
            label: Format
            type: string
            description: For example Compact Disc or Cassette.
          - name: year
            label: Year
            type: string
          - name: image
            label: Photo
            type: image
            description: >-
              A square photo works best; it is shown in the tab and, cropped
              to a square, in the left column.
          - name: image_alt
            label: Photo description
            type: string
            description: Read aloud by screen readers, and read by Google.
          - name: description
            label: Description
            type: text
          - name: specs
            label: Details
            type: string
            list: true
            description: One line each, listed under the description.
          - name: gallery
            label: More photos
            type: image
            options:
              multiple:
                max: 12
            description: >-
              Extra photos shown in the product's window, after the main one,
              at the size they are uploaded.
          - name: status
            label: Status
            type: string
            description: For example Sold out. Shown as a stamp under the details.
      - name: note
        label: Note under the items
        type: text

  - name: shop
    label: Merch shop (new products)
    path: _data/shop.yml
    type: file
    actions:
      - name: sync-printful
        label: Sync with Printful
        workflow: sync-printful.yml
        ref: current
        confirm:
          title: Sync with Printful?
          message: >-
            Reads every product in the Printful store and adds an entry here
            for each new one. What you set for the others is kept. Reload
            this page when it is done (about a minute).
          button: Sync
    fields:
      - name: products
        label: Products
        type: object
        list: true
        description: >-
          One entry per product on sale: its title, photos, description,
          details and a Sold out switch. Prices and sizes are set in
          Printful. After adding products in Printful, press "Sync with
          Printful" at the top of this page to get their entries here.
        fields:
          - name: name
            label: Printful product name
            type: string
            required: true
            description: >-
              The product's name in Printful, kept up to date by "Sync with
              Printful". Shoppers see it unless "Title on the site" is set.
          - name: printful_id
            label: Printful product number
            type: number
            description: >-
              Filled in by "Sync with Printful" and never changes, even if
              the product is renamed in Printful. Leave it as it is.
          - name: title
            label: Title on the site
            type: string
            description: >-
              The name shoppers see on the card, in the product's window and
              on the PayPal receipt. Empty: the Printful name is used.
          - name: mockups
            label: Mockups
            type: image
            options:
              multiple:
                max: 12
            description: >-
              Shown first in the product's window, at the size they are
              uploaded; the first one is also the picture on its card.
          - name: description
            label: Description
            type: text
          - name: specs
            label: Details
            type: string
            list: true
            description: One line each, listed under the description.
          - name: sold_out
            label: Sold out
            type: boolean
            description: >-
              On: the product shows a Sold out stamp and can't be bought
              (the PayPal buttons are hidden). Off: it is on sale.
      - name: show
        label: Show the shop
        type: boolean
        description: >-
          The new products, read live from the Printful store and paid with
          PayPal, under the CDs in the Merch tab. Products, photos and prices
          are changed in Printful, not here.
      - name: title
        label: Title
        type: string
      - name: intro
        label: Introduction
        type: text
      - name: functions_url
        label: Supabase function address
        type: string
        description: Leave as it is.
      - name: paypal_client_id
        label: PayPal client ID
        type: string
        description: >-
          The public Client ID of the PayPal app (never the secret). The
          PayPal buttons only show once it is filled in.

  - name: videos
    label: Videos tab
    path: _data/videos.yml
    type: file
    fields:
      - name: tab
        label: Tab name
        type: string
      - name: title
        label: Title
        type: string
      - name: intro
        label: Introduction
        type: text
      - name: channels
        label: Channels
        type: object
        list: true
        description: >-
          One channel per video, numbered in this order on the TV. Put the
          video in Google Drive, share it as "Anyone with the link", and
          paste that link here. Delete every channel to hide the tab.
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: url
            label: Google Drive link
            type: string
            required: true

  - name: bottom
    label: Logo, links and footer
    path: _data/bottom.yml
    type: file
    fields:
      - name: logo
        label: Logo
        type: image
        description: Shown small and centred under the presentation. Leave empty to hide it.
      - name: logo_alt
        label: Logo description
        type: string
        description: Read aloud by screen readers.
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Text
            type: string
            required: true
          - name: url
            label: Address
            type: string
            required: true
      - name: established
        label: Established
        type: string
      - name: byline
        label: Byline
        type: string
      - name: contact
        label: Text before the email
        type: string
      - name: email
        label: Email
        type: string

  - name: loop
    label: Loop video
    path: _data/loop.yml
    type: file
    fields:
      - name: video
        label: Video
        type: file
        description: >-
          Plays on its own, silent and looping, under the code buttons.
          To change it, remove the current file here, upload the new one and
          save; the file can have any name. Keep it short and small (a few
          MB, MP4 works everywhere). Leave it empty to hide the video.

  - name: codes
    label: Download codes
    path: _data/codes.yml
    type: file
    fields:
      - name: redeem_url
        label: Redeem page
        type: string
        description: Where fans type their code, e.g. https://mintsuit.bandcamp.com/yum
      - name: message
        label: Message before the link
        type: string
      - name: albums
        label: Albums
        type: object
        list: true
        description: >-
          One button per album in the left column, each handing out its codes
          one at a time, in this order. Bandcamp only exports unredeemed
          codes, so paste a fresh export to drop the used ones.
        fields:
          - name: title
            label: Album
            type: string
            required: true
          - name: color
            label: Text colour
            type: string
            description: >-
              The colour this album's codes print in, e.g. #000000 for black
              or #0033cc for blue.
          - name: codes
            label: Codes
            type: text
            description: >-
              Paste the whole column here, one code per line. Pasting the entire
              Bandcamp CSV export also works: only the codes are shown.

  - name: sharing
    label: Search and sharing
    path: _data/sharing.yml
    type: file
    fields:
      - name: page_title
        label: Browser tab title
        type: string
      - name: description
        label: Search description
        type: text
        description: The summary Google may show under the link.
      - name: share_description
        label: Share description
        type: text
        description: Shown when the link is posted on social media or in chats.
      - name: share_image
        label: Share image
        type: image
        description: 1200 × 630 works best.
      - name: share_image_alt
        label: Share image description
        type: string

  - name: not_found
    label: Page not found (404)
    path: _data/not_found.yml
    type: file
    fields:
      - name: page_title
        label: Browser tab title
        type: string
      - name: heading
        label: Heading
        type: string
      - name: message
        label: Message
        type: string
      - name: button
        label: Button text
        type: string
      - name: footer
        label: Footer
        type: string
